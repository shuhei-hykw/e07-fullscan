[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "e07fullscan"
version = "0.1.0"
description = "E07 full-scan analysis toolkit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
server = ["flask>=3.0"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[project.scripts]
e07view    = "e07fullscan.server.cli:main"
e07analyze = "e07fullscan.analyze.cli:main"
e07merge   = "e07fullscan.merge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["e07fullscan*"]

[tool.pytest.ini_options]
markers = [
  "slow: mark test as slow (run with pytest -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
