job:
  name:     e07full     # LSF job name (array index appended automatically)
  queue:    auto       # "auto" = pick the least-loaded usable queue at
                       # submission time (module.pipeline.lsf_queue).
                       # Which one that is changes by the hour.
  n_cores:  2            # CPU slots per job (-n); used by OpenCV threading
  mem_mb:   4000         # memory limit per job in MB (-M). This is also the
                         # HARD cap on every kekcc queue -- asking for more
                         # is not an option, so the job has to fit.
  walltime: "01:00"      # wall time HH:MM (-W); one view takes ~2 min
  n_jobs:   2025         # ONE view per job. Measured 2026-09-08 on a real
                         # E07 tile: 1 view peaks at 1.55 GB, 2 views at
                         # 4.35 GB, because results accumulate in memory
                         # until the chunk is written. Two views per job
                         # therefore already blows the 4 GB cap. The older
                         # value of 135 (15 views/job) is what produced the
                         # "Method A cannot go to LSF, it needs 6.75 GB"
                         # conclusion; per view it fits comfortably.
                         # Raising this again requires writing each view
                         # out as it finishes instead of at the end.

data:
  # NOTE: the tree has an E07/ level between fullscan/ and MOD108/. It was
  # missing here until 2026-09-08 and every job would have died on it.
  input: /gpfs/group/had/sks/E07/tohoku/fullscan/E07/MOD108/PL12/tohoku-v1/AREA00/IMAGE00_AREA00
  # NOT plain results/: that still holds the 2026-05-14 run at
  # hough_mg=5, and chunk_0001..0135 would collide with the first 135
  # jobs of the 2025-job array.
  output_dir: results/fullscan_v7
  total_views: 2025

analysis:
  config:  config/default.yaml
  workers: 1   # intra-job parallelism; 1 to stay inside mem_mb (parallelism
               # comes from n_jobs)
